<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   connect-src http://127.0.0.1:8000 'self';
                   style-src 'self' 'unsafe-inline';">
    <title>Response Monitor</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 13px;
        }
        .pane-controls { flex-shrink: 0; }
        .monitor-graph-area { flex: 1; min-height: 0; }
    </style>
</head>
<body>
    <div class="pane-controls">
        <input type="text" id="monitor-url" placeholder="Target URL to monitor..." spellcheck="false">
        <label class="monitor-cfg-label">Interval (s) <input id="monitor-interval" class="monitor-cfg-num" type="number" value="1.0" min="0.5" step="0.5"></label>
        <label class="monitor-cfg-label">Timeout (s) <input id="monitor-timeout" class="monitor-cfg-num" type="number" value="15" min="1" step="1"></label>
        <button id="btn-monitor-toggle">Start Monitor</button>
        <span id="monitor-status" class="monitor-status-badge">Idle</span>
    </div>
    <div class="monitor-graph-area">
        <canvas id="monitor-canvas"></canvas>
    </div>
    <div id="monitor-latest" class="monitor-latest"></div>

    <script src="js/monitor.js"></script>
    <script src="js/monitor-popout-init.js"></script>
</body>
</html>
